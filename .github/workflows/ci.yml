name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify on Linux
        if: runner.os != 'Windows'
        run: ./mvnw -B verify
      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B verify
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test demo backend
        run: python -m unittest discover -s demo -p "test_*.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tested image and validate compose
        run: |
          docker build -t jagatlabs-mcp-server:ci .
          docker compose --profile mcp config --quiet
      - name: Start mock backend
        run: docker compose up -d --wait mock
      - name: Check mock health
        run: curl --fail http://127.0.0.1:8090/health
      - name: Stop demo
        if: always()
        run: docker compose down
